name: protected-live

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: Owner-private manifest path on the dedicated Linux runner
        required: true
        type: string
      evidence_root:
        description: Owner-private evidence root on the dedicated Linux runner
        required: true
        type: string
      backup_root:
        description: New owner-private backup root reserved for this campaign
        required: true
        type: string
      restore_root:
        description: New owner-private isolated restore root reserved for this campaign
        required: true
        type: string
      fresh_install_root:
        description: New owner-private prefix for release fresh-install proof
        required: true
        type: string
      upgrade_root:
        description: New owner-private prefix for prior-release upgrade proof
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: protected-live
  cancel-in-progress: false

jobs:
  e0-live-campaign:
    name: E0 real Telegram campaign
    runs-on: [self-hosted, linux, x64, devcrew-live]
    timeout-minutes: 120
    environment: devcrew-live
    env:
      DEVCREW_LIVE_MANIFEST: ${{ inputs.manifest_path }}
      DEVCREW_LIVE_EVIDENCE_ROOT: ${{ inputs.evidence_root }}
      DEVCREW_LIVE_BACKUP_ROOT: ${{ inputs.backup_root }}
      DEVCREW_LIVE_RESTORE_ROOT: ${{ inputs.restore_root }}
      DEVCREW_LIVE_FRESH_INSTALL_ROOT: ${{ inputs.fresh_install_root }}
      DEVCREW_LIVE_UPGRADE_ROOT: ${{ inputs.upgrade_root }}
      GH_TOKEN: ${{ secrets.DEVCREW_LIVE_GH_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Require protected Linux prerequisites
        run: |
          test "${RUNNER_OS}" = Linux
          test -n "${DEVCREW_LIVE_MANIFEST}"
          test -n "${DEVCREW_LIVE_EVIDENCE_ROOT}"
          test -n "${DEVCREW_LIVE_BACKUP_ROOT}"
          test -n "${DEVCREW_LIVE_RESTORE_ROOT}"
          test -n "${DEVCREW_LIVE_FRESH_INSTALL_ROOT}"
          test -n "${DEVCREW_LIVE_UPGRADE_ROOT}"
          test -n "${GH_TOKEN}"
      - run: go mod download
      - name: Run real Telegram campaign and closeout
        run: make test-live
